name: Descomprimir ZIP en Raíz

on:
  workflow_dispatch:

jobs:
  unzip:
    name: Descomprimir y Actualizar Repositorio
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio usando el PAT_TOKEN para tener permisos sobre los workflows
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      # 2. Descomprimir el archivo en la raíz del repositorio
      - name: Extract ZIP file
        run: |
          ZIP_NAME="Zenonia3-r36s.zip"
          if [ -f "$ZIP_NAME" ]; then
            echo "Descomprimiendo $ZIP_NAME en la raíz..."
            unzip -o "$ZIP_NAME" -d .
          else
            echo "Error: El archivo $ZIP_NAME no existe en la raíz del repositorio."
            exit 1
          fi

      # 3. Configurar git y hacer commit de los archivos descomprimidos (opcional)
      - name: Commit extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git status
          if git diff-index --quiet HEAD; then
            echo "No hay cambios para confirmar."
          else
            git commit -m "chore: descomprimir Zenonia3-r36s.zip automáticamente"
            git push
          fi
