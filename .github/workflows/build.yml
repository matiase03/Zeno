name: Build Zenonia3 R36S
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver contenido del repo
        shell: bash
        run: |
          ls -la
          test -f build.sh || { echo "FALTA build.sh en la raiz"; exit 1; }
          test -d src || { echo "FALTA src/ en la raiz"; exit 1; }

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Compilar (Debian bullseye armhf)
        shell: bash
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD":/w -w /w debian:bullseye-slim bash -c '
            set -ex
            echo "deb http://archive.debian.org/debian/ bullseye main" > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get install -y gcc libc6-dev libsdl2-dev file
            bash ./build.sh
          ' 2>&1 | tee build.log

      - name: Verificar binario y empaquetar
        shell: bash
        run: |
          test -f out/zenonia3/zenonia3.armhf || { echo "NO se genero el binario"; exit 1; }
          cd out && zip -r ../zenonia3-r36s-overlay.zip .

      - name: Subir log (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: zenonia3-r36s-overlay
          path: zenonia3-r36s-overlay.zip
