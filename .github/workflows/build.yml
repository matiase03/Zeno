name: Compilar Port Zenonia 3

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 1. Configurar QEMU para permitir emulación de arquitecturas ARM (armhf/armv7) en runners x86_64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar entorno y compilar en Debian Bullseye (armhf)
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD":/w -w /w debian:bullseye-slim bash -c '
            # Corregir repositorios para usar el archivo histórico de Debian
            echo "deb http://archive.debian.org/debian/ bullseye main" > /etc/apt/sources.list
            echo "deb http://archive.debian.org/debian-security/ bullseye-security main" >> /etc/apt/sources.list
            sed -i "/debconf\/frontend/d" /etc/environment || true
            
            # Actualizar e instalar dependencias necesarias
            apt-get update -o Acquire::Check-Valid-Until=false || true
            apt-get install -y -o Acquire::Check-Valid-Until=false build-essential cmake libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev || ./build.sh
            
            # Ejecutar el script de compilación del proyecto
            chmod +x build.sh
            ./build.sh
          '

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: zenonia3-r36s-build
          path: |
            *.zip
            *.tar.gz
            port/
            build/
