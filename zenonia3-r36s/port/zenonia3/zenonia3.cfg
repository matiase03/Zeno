# ===== Zenonia 3 R36S - configuracion =====
# Resolucion que se le informa al juego (si 0 usa la de la pantalla)
set width 640
set height 480
# Idioma (getLocaleID). Probar 0,1,2... si el juego sale en coreano/japones
set locale 0
# Argumentos de NativeInitDeviceInfo (no se conocen del todo)
set devinfo_a 1
set devinfo_b 0

# ===== Controles =====
# Los botones de la consola llegan como teclas via gptokeyb (ver zenonia3.gptk):
#   A=x  B=z  X=c  Y=v  L1=1  R1=2  L2=3  R2=4  Start=Return  Select=m
# "hal N"  = tecla del juego (-1 arriba, -2 abajo, -3 izq, -4 der, -5 OK/ataque, -8 atras, -16 borrar)
# "cmd a b c d" = evento especial. Con "@" solo vale mientras se ve el menu de titulo.
# El PRIMER bind que coincida gana, asi que los de titulo van arriba.

bind X      = @ cmd 19450815 20010911 0 0    # titulo: boton 1 (supuesto NUEVO JUEGO)
bind Z      = @ cmd 19450815 20010912 0 0    # titulo: boton 2 (supuesto CONTINUAR)
bind C      = @ cmd 19450815 20010913 0 0    # titulo: boton 3 (supuesto OPCIONES)

bind Up     = hal -1
bind Down   = hal -2
bind Left   = hal -3
bind Right  = hal -4
bind X      = hal -5
bind Z      = hal -16
bind C      = hal -8
bind V      = hal -5
bind Return = hal -8
bind 1      = hal 49
bind 2      = hal 50
bind 3      = hal 51
bind 4      = hal 52
